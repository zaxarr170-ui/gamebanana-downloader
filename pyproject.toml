[project]
name = "gamebanana_downloader"
version = "8.0.0"
description = "Умный загрузчик модов GameBanana"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet",
    "requests",
    "tqdm",
    "colorama",
    "rarfile",
    # .7z на Android: py7zr тянет бинарные зависимости (pycryptodomex, pyzstd),
    # для которых может не быть Android-колёс. Если сборка падает — оставь закомментированным.
    # "py7zr",
]

[tool.flet]
org = "com.ziler"
product = "GameBanana Downloader"
icon_background = "#0a0918"

[tool.flet.app]
path = "src"
module = "main.py"

[tool.flet.android]
min_sdk_version = 24
target_sdk_version = 35

[tool.flet.android.permission]
"android.permission.INTERNET" = true
