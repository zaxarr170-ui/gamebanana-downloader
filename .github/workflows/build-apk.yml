name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: yes | flet build apk || yes | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamebanana-apk
          path: build/apk/*.apk
          if-no-files-found: error
